<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>Companion AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#08090d;color:#f5f5f7}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;background:radial-gradient(circle at 20% 0,#25183c,transparent 38%),#08090d}.side{width:260px;border-right:1px solid #292a34;padding:20px;background:#0c0d12}.brand{font-weight:800;font-size:21px;display:flex;gap:10px;align-items:center;margin-bottom:25px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#985bff,#ff4fa3);display:grid;place-items:center}.nav button,.ghost{width:100%;padding:11px 13px;background:transparent;color:#aaa;border:0;border-radius:10px;text-align:left}.nav button:hover,.ghost:hover{background:#191a21;color:#fff}.main{flex:1;min-width:0}.top{height:68px;border-bottom:1px solid #292a34;display:flex;align-items:center;justify-content:space-between;padding:0 25px;gap:12px}.search,.composer input,.field input,.field textarea,.field select{background:#15161c;border:1px solid #30313b;border-radius:12px;padding:11px 13px;color:#fff;outline:none;width:100%}.search{width:min(430px,55vw)}.content{max-width:1200px;margin:auto;padding:30px}.hero h1{font-size:40px;margin:20px 0 8px}.muted{color:#999aa5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px;margin-top:18px}.card{background:#111218;border:1px solid #292a34;border-radius:18px;padding:14px}.thumb{height:210px;border-radius:14px;overflow:hidden;background:#20212c;position:relative}.thumb img{width:100%;height:100%;object-fit:cover}.thumb .fallback{height:100%;display:grid;place-items:center;font-size:60px}.name{font-weight:750;margin-top:12px}.desc{font-size:13px;color:#9697a2;line-height:1.4;margin:5px 0 12px}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#20212a;color:#c4c5cf}.primary{border:0;background:linear-gradient(135deg,#8d55ff,#e04da7);color:white;padding:11px 15px;border-radius:11px;font-weight:700}.chat{height:calc(100vh - 68px);display:flex}.chatmain{flex:1;display:flex;flex-direction:column}.msgs{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:13px}.msg{max-width:min(760px,85%);padding:13px 15px;border-radius:16px;line-height:1.5;white-space:pre-wrap}.ai{background:#171820}.me{background:#7042d8;align-self:flex-end}.composer{padding:13px 18px;border-top:1px solid #292a34;display:flex;gap:9px;align-items:center}.composer input{flex:1}.iconbtn{border:1px solid #343542;background:#171820;color:#ddd;border-radius:11px;padding:10px}.mode{font-size:12px;color:#bbb;background:#171820;border:1px solid #30313b;padding:8px;border-radius:10px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px;z-index:20}.modalbox{width:min(850px,100%);max-height:92vh;overflow:auto;background:#101117;border:1px solid #343540;border-radius:22px;padding:22px}.steps{display:flex;gap:8px;overflow:auto;margin:12px 0 20px}.step{padding:8px 12px;border-radius:999px;background:#191a22;color:#888;white-space:nowrap}.step.active{background:#7042d8;color:white}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:12px;color:#aaa;margin-bottom:6px}.field.full{grid-column:1/-1}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{border:1px solid #30313b;background:#15161c;border-radius:14px;padding:8px;text-align:left;color:#eee}.choice.active{border-color:#a264ff;box-shadow:0 0 0 1px #a264ff}.choice img{width:100%;height:110px;object-fit:cover;border-radius:9px;display:block;margin-bottom:7px}.choice b{font-size:12px}.upload{border:1px dashed #444652;padding:18px;border-radius:14px;text-align:center}.preview{max-width:160px;max-height:160px;border-radius:14px;margin-top:10px}.row{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.file{display:none}.badge{font-size:11px;color:#cfc;background:#16271d;border-radius:8px;padding:5px 8px}@media(max-width:760px){.side{display:none}.top{padding:0 14px}.content{padding:20px 14px}.hero h1{font-size:30px}.grid{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.choices{grid-template-columns:repeat(2,1fr)}.msg{max-width:92%}.composer{padding:9px}.mode{display:none}}</style></head><body><div id="root"></div><script type="module">import{CreateMLCEngine}from'https://esm.run/@mlc-ai/web-llm';const MODEL='Llama-3.2-1B-Instruct-q4f32_1-MLC';let engine=null,current=null;let chars=JSON.parse(localStorage.chars||'null')||[{id:'luna',name:'Luna',emoji:'🌙',cat:'Towarzyszka',desc:'Spokojna, ciepła i ciekawa rozmówczyni.',personality:'Jesteś Luną, spokojną i ciepłą rozmówczynią.',greet:'Hej! O czym dziś porozmawiamy?',mode:'Romantic'}];let chats=JSON.parse(localStorage.chats||'{}');const photos={body:[['Drobna sylwetka','https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500','🌿'],['Pełniejsza sylwetka','https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=500','✨'],['Atletyczna sylwetka','https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500','💪']],origin:[['Azjatka','https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500','🌸'],['Czarnoskóra','https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=500','🖤'],['Latynoska','https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=500','🌺']],style:[['Elegancka','https://images.unsplash.com/photo-1483985988355-763728e1935b?w=500','👗'],['Casual','https://images.unsplash.com/photo-1485968579580-b6d095142e6e?w=500','👕'],['Sportowa','https://images.unsplash.com/photo-1518611012118-696072aa579a?w=500','🏃']]};function save(){localStorage.chars=JSON.stringify(chars);localStorage.chats=JSON.stringify(chats)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function home(){root.innerHTML=`<div class="app"><aside class="side"><div class="brand"><span class="logo">✦</span>Companion AI</div><div class="nav"><button onclick="home()">⌂ Odkrywaj</button><button onclick="builder()">＋ Kreator postaci</button></div><div style="margin-top:30px" class="muted">⚡ AI lokalne<br><small>Bez konta i bez limitu wiadomości.</small></div></aside><main class="main"><header class="top"><input id="q" class="search" placeholder="Szukaj postaci..." oninput="cards()"><button class="primary" onclick="builder()">＋ Nowa postać</button></header><div class="content"><div class="hero"><h1>Twoi AI companions.</h1><p class="muted">Role-play, własne postacie, głos i zdjęcia — wszystko lokalnie.</p></div><h2>Postacie</h2><div id="cards" class="grid"></div></div></main></div>`;cards()}function cards(){let q=(document.getElementById('q')?.value||'').toLowerCase();document.getElementById('cards').innerHTML=chars.filter(c=>(c.name+c.desc+c.cat).toLowerCase().includes(q)).map(c=>`<article class="card"><div class="thumb">${c.avatar?`<img src="${esc(c.avatar)}">`:`<div class="fallback">${esc(c.emoji||'✨')}</div>`}</div><div class="name">${esc(c.name)}</div><div class="desc">${esc(c.desc)}</div><span class="pill">${esc(c.cat)}</span><button class="primary" style="width:100%;margin-top:12px" onclick="chat('${esc(c.id)}')">Rozpocznij role-play</button></article>`).join('')}function builder(id){let c=id?chars.find(x=>x.id===id):{name:'',emoji:'✨',cat:'Towarzysz',desc:'',personality:'Jesteś pomocnym rozmówcą. Odpowiadasz po polsku.',greet:'Cześć!',mode:'Romantic',body:'Drobna sylwetka',origin:'Azjatka',style:'Casual',age:25,avatar:''};let html=`<div class="modal" id="modal"><div class="modalbox"><h2>${id?'Edytuj postać':'Kreator postaci'}</h2><div class="steps"><span class="step active">1 Wygląd</span><span class="step active">2 Osobowość</span><span class="step active">3 Role-play</span><span class="step active">4 Avatar</span></div><div class="fields"><div class="field"><label>Nazwa</label><input id="cn" value="${esc(c.name)}"></div><div class="field"><label>Wiek (18+)</label><input id="ca" type="number" min="18" value="${c.age||25}"></div><div class="field full"><label>Typ sylwetki — wybierz wizualnie</label><div class="choices">${photos.body.map(x=>`<button type="button" class="choice ${c.body===x[0]?'active':''}" onclick="pick(this,'body','${x[0]}')"><img src="${x[1]}"><b>${x[2]} ${x[0]}</b></button>`).join('')}</div><input id="body" type="hidden" value="${esc(c.body||'Drobna sylwetka')}"></div><div class="field full"><label>Pochodzenie / wygląd — wybierz wizualnie</label><div class="choices">${photos.origin.map(x=>`<button type="button" class="choice ${c.origin===x[0]?'active':''}" onclick="pick(this,'origin','${x[0]}')"><img src="${x[1]}"><b>${x[2]} ${x[0]}</b></button>`).join('')}</div><input id="origin" type="hidden" value="${esc(c.origin||'Azjatka')}"></div><div class="field full"><label>Styl ubioru</label><div class="choices">${photos.style.map(x=>`<button type="button" class="choice ${c.style===x[0]?'active':''}" onclick="pick(this,'style','${x[0]}')"><img src="${x[1]}"><b>${x[2]} ${x[0]}</b></button>`).join('')}</div><input id="style" type="hidden" value="${esc(c.style||'Casual')}"></div><div class="field"><label>Kategoria</label><input id="cc" value="${esc(c.cat)}"></div><div class="field"><label>Tryb rozmowy</label><select id="cm"><option ${c.mode==='Romantic'?'selected':''}>Romantic</option><option ${c.mode==='Spicy'?'selected':''}>Spicy</option><option ${c.mode==='Naughty'?'selected':''}>Naughty</option><option ${c.mode==='Flirty'?'selected':''}>Flirty</option><option ${c.mode==='Funny'?'selected':''}>Funny</option><option ${c.mode==='Adventure'?'selected':''}>Adventure</option></select></div><div class="field full"><label>Opis</label><textarea id="cd">${esc(c.desc)}</textarea></div><div class="field full"><label>Osobowość AI</label><textarea id="cp">${esc(c.personality)}</textarea></div><div class="field full"><label>Pierwsza wiadomość</label><textarea id="cg">${esc(c.greet)}</textarea></div><div class="field full"><label>Zdjęcie / avatar z telefonu</label><div class="upload"><label for="photo" class="primary">📷 Wybierz zdjęcie</label><input id="photo" class="file" type="file" accept="image/*" onchange="preview(event)"><div id="prev">${c.avatar?`<img class="preview" src="${esc(c.avatar)}">`:''}</div></div><input id="avatar" type="hidden" value="${esc(c.avatar||'')}"></div></div><div class="row"><button class="ghost" style="width:auto" onclick="document.getElementById('modal').remove()">Anuluj</button><button class="primary" onclick="saveChar('${esc(id||'')}')">Zapisz postać</button></div></div></div>`;root.insertAdjacentHTML('beforeend',html)}function pick(btn,id,val){document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById(id).value=val}function preview(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{avatar.value=r.result;prev.innerHTML=`<img class="preview" src="${r.result}">`};r.readAsDataURL(f)}function saveChar(id){let data={id:id||'c'+Date.now(),name:cn.value.trim()||'Nowa postać',age:Math.max(18,Number(ca.value)||25),emoji:'✨',cat:cc.value||'Towarzysz',desc:cd.value,personality:cp.value||'Jesteś pomocnym rozmówcą.',greet:cg.value||'Cześć!',mode:cm.value,body:body.value,origin:origin.value,style:style.value,avatar:avatar.value||''};if(id)Object.assign(chars.find(x=>x.id===id),data);else chars.push(data);save();document.getElementById('modal').remove();home()}async function ai(){if(engine)return true;try{engine=await CreateMLCEngine(MODEL,{initProgressCallback:p=>{let s=document.getElementById('status');if(s)s.textContent='Model '+Math.round((p.progress||0)*100)+'%'}});return true}catch(e){alert('Wymagana jest aktualna przeglądarka z WebGPU.');return false}}function chat(id){current=chars.find(c=>c.id===id);if(!chats[id])chats[id]=[{role:'ai',text:current.greet}];save();root.innerHTML=`<div class="app"><main class="main"><header class="top"><button class="ghost" style="width:auto" onclick="home()">←</button><b>${esc(current.name)}</b><span id="status" class="badge">AI lokalne</span><span class="mode">Tryb: ${esc(current.mode)}</span><button class="iconbtn" onclick="toggleLive()">🎙️ <span id="liveText">Live</span></button></header><div class="chat"><section class="chatmain"><div id="msgs" class="msgs"></div><form class="composer" onsubmit="send(event)"><label class="iconbtn">📷<input class="file" type="file" accept="image/*" onchange="sendImage(event)"></label><input id="input" placeholder="Napisz wiadomość..."><button class="primary">Wyślij</button></form></section></div></div>`;renderMsgs()}function renderMsgs(){msgs.innerHTML=chats[current.id].map(m=>m.image?`<div class="msg me"><img style="max-width:260px;border-radius:12px" src="${m.image}"><br>${esc(m.text||'')}</div>`:`<div class="msg ${m.role==='ai'?'ai':'me'}">${esc(m.text)}</div>`).join('');msgs.scrollTop=msgs.scrollHeight}function sendImage(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{chats[current.id].push({role:'user',image:r.result,text:'[Zdjęcie]'});save();renderMsgs()};r.readAsDataURL(f)}async function send(e){e.preventDefault();let t=input.value.trim();if(!t)return;chats[current.id].push({role:'user',text:t});input.value='';save();renderMsgs();if(!(await ai()))return;status.textContent='Myślę…';let hist=[{role:'system',content:`Jesteś ${current.name}. Osobowość: ${current.personality}. Wygląd: ${current.body}, ${current.origin}, styl ${current.style}. Tryb rozmowy: ${current.mode}. Odpowiadasz po polsku, naturalnie i bez opisywania instrukcji.`},...chats[current.id].slice(-18).filter(x=>x.text).map(x=>({role:x.role==='ai'?'assistant':'user',content:x.text}))];try{let r=await engine.chat.completions.create({messages:hist,temperature:.9,max_tokens:700});chats[current.id].push({role:'ai',text:r.choices[0].message.content});save();renderMsgs()}catch(err){chats[current.id].push({role:'ai',text:'Model lokalny chwilowo nie odpowiada. Spróbuj ponownie.'});save();renderMsgs()}status.textContent='AI lokalne'}let live=false,recog=null;function toggleLive(){if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){alert('Ta przeglądarka nie obsługuje rozpoznawania mowy.');return}live=!live;liveText.textContent=live?'Live ON':'Live';if(live){let R=window.SpeechRecognition||window.webkitSpeechRecognition;recog=new R();recog.lang='pl-PL';recog.continuous=true;recog.interimResults=false;recog.onresult=e=>{let t=e.results[e.results.length-1][0].transcript;input.value=t;send(new Event('submit',{cancelable:true}))};recog.start()}else if(recog)recog.stop()}window.home=home;window.cards=cards;window.builder=builder;window.pick=pick;window.preview=preview;window.saveChar=saveChar;window.chat=chat;window.send=send;window.sendImage=sendImage;window.toggleLive=toggleLive;home();</script></body></html>
