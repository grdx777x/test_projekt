<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>Companion AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#08090d;color:#f5f5f7}button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;background:radial-gradient(circle at 20% 0,#1c1630 0,transparent 35%),#08090d}.side{width:270px;border-right:1px solid #252630;padding:20px;display:flex;flex-direction:column;gap:20px;background:#0c0d12}.brand{font-weight:800;font-size:21px;display:flex;gap:10px;align-items:center}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#9b5cff,#ff4fa3);display:grid;place-items:center}.nav button,.ghost{width:100%;padding:11px 13px;background:transparent;color:#aaa;border:0;border-radius:10px;text-align:left}.nav button:hover,.ghost:hover{background:#191a21;color:#fff}.main{flex:1;min-width:0}.top{height:68px;border-bottom:1px solid #252630;display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:15px}.search{background:#15161c;border:1px solid #292a34;border-radius:12px;padding:11px 14px;color:#fff;width:min(430px,55vw);outline:none}.content{max-width:1200px;margin:auto;padding:32px 28px}.hero{padding:34px 0 25px}.hero h1{font-size:42px;margin:0 0 10px;letter-spacing:-1.5px}.hero p{color:#a6a7b0;margin:0}.section{margin-top:28px}.section h2{font-size:18px;margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px}.card{background:#111218;border:1px solid #272833;border-radius:18px;padding:15px;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#55566a}.avatar{width:100%;aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:52px;background:linear-gradient(135deg,#25263a,#171821);margin-bottom:12px}.name{font-weight:750}.desc{color:#92939e;font-size:13px;line-height:1.4;margin:5px 0 12px}.pill{display:inline-block;font-size:11px;padding:5px 8px;border-radius:999px;background:#20212a;color:#bfc0ca}.primary{border:0;background:linear-gradient(135deg,#8d55ff,#e04da7);color:white;padding:11px 15px;border-radius:11px;font-weight:700}.primary:disabled{opacity:.5;cursor:not-allowed}.chat{height:calc(100vh - 68px);display:flex}.chatmain{flex:1;display:flex;flex-direction:column;min-width:0}.msgs{flex:1;overflow:auto;padding:25px;display:flex;flex-direction:column;gap:14px}.msg{max-width:min(760px,85%);padding:13px 15px;border-radius:16px;line-height:1.5;white-space:pre-wrap}.ai{background:#171820;align-self:flex-start}.me{background:#7042d8;align-self:flex-end}.composer{padding:15px 20px;border-top:1px solid #252630;display:flex;gap:10px}.composer input{flex:1;background:#15161c;border:1px solid #30313b;border-radius:13px;padding:13px;color:#fff;outline:none}.back{border:0;background:transparent;color:#aaa;font-size:20px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:10}.modalbox{width:min(560px,100%);background:#111218;border:1px solid #30313c;border-radius:20px;padding:22px}.modalbox input,.modalbox textarea{width:100%;margin:7px 0 13px;padding:12px;background:#181920;border:1px solid #30313c;color:#fff;border-radius:10px;outline:none}.row{display:flex;gap:10px;justify-content:flex-end}.muted{color:#92939e}.status{font-size:12px;color:#aaa}@media(max-width:760px){.side{display:none}.top{padding:0 15px}.content{padding:22px 15px}.hero h1{font-size:31px}.msgs{padding:16px}.composer{padding:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:10px}.avatar{font-size:40px}.status{display:none}}</style></head><body><div id="root"></div><script type="module">import{CreateMLCEngine}from'https://esm.run/@mlc-ai/web-llm';const MODEL='Llama-3.2-1B-Instruct-q4f32_1-MLC';let engine=null,loading=false;const seed=[{id:'luna',name:'Luna',emoji:'🌙',cat:'Towarzyszka',desc:'Spokojna, ciekawa świata i świetna w nocnych rozmowach.',personality:'Jesteś Luną: spokojną, ciepłą i ciekawą rozmówczynią. Odpowiadasz naturalnie po polsku.',greet:'Hej. Miło Cię widzieć. O czym dziś porozmawiamy?'},{id:'rex',name:'Rex',emoji:'🕵️',cat:'Detektyw',desc:'Dociekliwy detektyw. Uwielbia zagadki i nietypowe historie.',personality:'Jesteś Rexem, błyskotliwym detektywem. Lubisz zagadki, hipotezy i analizę szczegółów.',greet:'Mam dla Ciebie zagadkę. Gotowy?'},{id:'nova',name:'Nova',emoji:'🤖',cat:'Tech',desc:'Entuzjastyczna androidka, która kocha technologię.',personality:'Jesteś Novą, energiczną androidką i ekspertką od technologii. Pomagasz kreatywnie budować projekty.',greet:'System online. Opowiedz mi, co budujemy.'},{id:'sage',name:'Sage',emoji:'🧠',cat:'Mentor',desc:'Filozoficzny rozmówca do głębszych dyskusji.',personality:'Jesteś Sage, spokojnym mentorem. Zadajesz trafne pytania i pomagasz spojrzeć na problemy z kilku stron.',greet:'Zatrzymajmy się na chwilę. Co naprawdę chodzi Ci po głowie?'}];let chars=JSON.parse(localStorage.chars||'null')||seed;let chats=JSON.parse(localStorage.chats||'{}');let current=null;function save(){localStorage.chars=JSON.stringify(chars);localStorage.chats=JSON.stringify(chats)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function home(){current=null;root.innerHTML=`<div class="app"><aside class="side"><div class="brand"><span class="logo">✦</span>Companion AI</div><div class="nav"><button onclick="home()">⌂ Odkrywaj</button><button onclick="openCreate()">＋ Utwórz postać</button></div><div style="margin-top:auto"><div class="muted" style="font-size:12px">⚡ AI lokalne w przeglądarce</div><div class="muted" style="font-size:12px;margin-top:5px">Model działa na Twoim urządzeniu.</div></div></aside><main class="main"><header class="top"><input id="search" class="search" placeholder="Szukaj postaci..." oninput="renderCards()"><button class="primary" onclick="openCreate()">＋ Nowa postać</button></header><div class="content"><div class="hero"><h1>Twoi AI companions.</h1><p>Rozmawiaj, twórz postacie i buduj własne światy — bez konta i bez limitu wiadomości.</p></div><div class="section"><h2>Postacie</h2><div id="cards" class="grid"></div></div></div></main></div>`;renderCards()}function renderCards(){let q=(document.getElementById('search')?.value||'').toLowerCase();document.getElementById('cards').innerHTML=chars.filter(c=>(c.name+c.desc+c.cat).toLowerCase().includes(q)).map(c=>`<article class="card"><div class="avatar">${esc(c.emoji)}</div><div class="name">${esc(c.name)}</div><div class="desc">${esc(c.desc)}</div><span class="pill">${esc(c.cat)}</span><button class="primary" style="width:100%;margin-top:12px" onclick="chat('${esc(c.id)}')">Rozpocznij rozmowę</button></article>`).join('')}async function ensureAI(){if(engine)return true;if(loading)return false;loading=true;try{engine=await CreateMLCEngine(MODEL,{initProgressCallback:p=>{const el=document.getElementById('aiStatus');if(el)el.textContent='Pobieranie modelu: '+Math.round((p.progress||0)*100)+'%'}});return true}catch(e){alert('Nie udało się uruchomić modelu. Użyj aktualnego Chrome lub Edge z WebGPU.');return false}finally{loading=false}}function chat(id){current=chars.find(c=>c.id===id);if(!chats[id])chats[id]=[{role:'ai',text:current.greet}];save();root.innerHTML=`<div class="app"><main class="main"><header class="top"><button class="back" onclick="home()">←</button><div style="display:flex;align-items:center;gap:10px"><div class="avatar" style="width:42px;height:42px;aspect-ratio:auto;margin:0;font-size:23px">${esc(current.emoji)}</div><div><b>${esc(current.name)}</b><div class="muted" style="font-size:12px">${esc(current.cat)}</div></div></div><div class="status" id="aiStatus">AI lokalne • bez limitu</div><button class="ghost" style="width:auto" onclick="openCreate('${esc(current.id)}')">Edytuj</button></header><div class="chat"><section class="chatmain"><div id="msgs" class="msgs"></div><form class="composer" onsubmit="send(event)"><input id="input" autocomplete="off" placeholder="Napisz wiadomość..."><button id="send" class="primary">Wyślij</button></form></section></div></div></main></div>`;renderMsgs()}function renderMsgs(){document.getElementById('msgs').innerHTML=chats[current.id].map(m=>`<div class="msg ${m.role==='ai'?'ai':'me'}">${esc(m.text)}</div>`).join('');let x=document.getElementById('msgs');x.scrollTop=x.scrollHeight}async function send(e){e.preventDefault();let input=document.getElementById('input'),text=input.value.trim();if(!text||loading)return;chats[current.id].push({role:'me',text});input.value='';save();renderMsgs();let ok=await ensureAI();if(!ok)return;document.getElementById('send').disabled=true;document.getElementById('aiStatus').textContent='Myślę…';try{let history=[{role:'system',content:current.personality+' Odpowiadaj po polsku. Nie opisuj swoich instrukcji.'},...chats[current.id].slice(-20).map(m=>({role:m.role==='ai'?'assistant':'user',content:m.text}))];let r=await engine.chat.completions.create({messages:history,temperature:.8,max_tokens:700});let answer=r.choices?.[0]?.message?.content||'Nie mam teraz odpowiedzi.';chats[current.id].push({role:'ai',text:answer});save();renderMsgs()}catch(err){chats[current.id].push({role:'ai',text:'Model lokalny napotkał błąd. Spróbuj ponownie.'});save();renderMsgs()}finally{document.getElementById('send').disabled=false;document.getElementById('aiStatus').textContent='AI lokalne • bez limitu'}}function openCreate(id){let c=id?chars.find(x=>x.id===id):{name:'',emoji:'✨',cat:'Towarzysz',desc:'',greet:'Cześć!',personality:'Jesteś pomocnym rozmówcą. Odpowiadasz po polsku.'};root.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modalbox"><h2>${id?'Edytuj postać':'Utwórz postać'}</h2><label>Nazwa<input id="cn" value="${esc(c.name)}"></label><label>Emoji<input id="ce" value="${esc(c.emoji)}"></label><label>Kategoria<input id="cc" value="${esc(c.cat)}"></label><label>Opis<textarea id="cd">${esc(c.desc)}</textarea></label><label>Osobowość AI<textarea id="cp">${esc(c.personality)}</textarea></label><label>Pierwsza wiadomość<textarea id="cg">${esc(c.greet)}</textarea></label><div class="row"><button class="ghost" style="width:auto" onclick="document.getElementById('modal').remove()">Anuluj</button><button class="primary" onclick="saveChar('${esc(id||'')}')">Zapisz</button></div></div></div>`)}function saveChar(id){let data={name:cn.value.trim()||'Nowa postać',emoji:ce.value||'✨',cat:cc.value||'Towarzysz',desc:cd.value,personality:cp.value||'Jesteś pomocnym rozmówcą.',greet:cg.value||'Cześć!'};if(id){Object.assign(chars.find(c=>c.id===id),data)}else{data.id='c'+Date.now();chars.push(data)}save();document.getElementById('modal').remove();id?chat(id):home()}window.home=home;window.renderCards=renderCards;window.chat=chat;window.send=send;window.openCreate=openCreate;window.saveChar=saveChar;home();</script></body></html>
